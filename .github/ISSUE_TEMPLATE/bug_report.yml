name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first, and do not
        include secrets, passwords, private keys, or API keys in this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so we can reproduce it.
      placeholder: |
        1. Open ...
        2. Connect to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (x86_64)
        - Linux (aarch64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Termlet version
      description: Shown as `version (build date)` on the About screen, or the commit if built from source.
      placeholder: "1.0.0 (2026-10-13)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Built from source
        - .deb package
        - macOS .dmg / .app
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description: Optional — the part of the app involved.
      options:
        - Terminal
        - SSH connection
        - SFTP
        - Port forwarding
        - Hosts / keychain
        - Known hosts
        - Snippets
        - Workspace / session recovery
        - Settings / themes / i18n
        - Not sure
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: |
        Optional. Crash reports are under `~/.termlet/crashes/`. Review before
        pasting — they may contain paths or other local detail.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed any secrets, passwords, keys, and API keys from this report.
          required: true
